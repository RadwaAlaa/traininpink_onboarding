include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - lib/**/*.g.dart
    - lib/core/l10n/generated/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_final_locals
    - require_trailing_commas
